name: Build mittwald container image

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: mittwald-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}:git-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_HASH=${{ github.sha }}
            PRELOAD_MODELS=false
            NODE_BUILD_HEAP_MB=8192
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test read-only container startup
        env:
          IMAGE: ${{ steps.image.outputs.name }}:git-${{ github.sha }}
        run: bash deploy/mittwald/smoke-test.sh "$IMAGE"
      - name: Publish tested image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:git-${GITHUB_SHA}"
          docker push "$image"
          digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
          docker tag "$image" "${IMAGE_NAME}:${GITHUB_REF_NAME}"
          docker push "${IMAGE_NAME}:${GITHUB_REF_NAME}"
          echo "Image: ${IMAGE_NAME}@${digest}" >> "$GITHUB_STEP_SUMMARY"
